services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ngofund}
      POSTGRES_USER: ${POSTGRES_USER:-ngofund}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18's image switched to storing data under /var/lib/postgresql (versioned
      # subdirectory inside), not /var/lib/postgresql/data as in older images.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ngofund} -d ${POSTGRES_DB:-ngofund}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: applies pending EF Core migrations and seeds reference data + the initial Super
  # Admin user, then exits 0. `api` will not start until this completes successfully.
  migrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrator
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-ngofund};Username=${POSTGRES_USER:-ngofund};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-ngofund};Username=${POSTGRES_USER:-ngofund};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-NgoFund}
      Jwt__Audience: ${JWT_AUDIENCE:-NgoFundClients}
      Storage__RootPath: /app/storage
      GoogleFormIntake__ApiKey: ${GOOGLE_FORM_INTAKE_API_KEY:-}
      Intake__Port: "8081"
    ports:
      - "${API_PORT:-8080}:8080"
      - "127.0.0.1:${INTAKE_PORT:-8081}:8081"
    volumes:
      - filestore:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
    command: http --url=unrupturable-unreticently-carl.ngrok-free.dev api:8081
    depends_on:
      api:
        condition: service_healthy

  # Optional DB admin UI — only starts with `docker compose --profile tools up`.
  pgadmin:
    image: dpage/pgadmin4
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@ngofund.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db

volumes:
  pgdata:
  filestore:
